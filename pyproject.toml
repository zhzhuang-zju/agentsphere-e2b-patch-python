[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentsphere-e2b-patch"
version = "0.1.1"
description = "Patch the official E2B Python SDK so envd (port 49983) requests send e2b-traffic-access-token."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Agentsphere" }]
keywords = ["e2b", "agentsphere", "sandbox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
# Do not pin e2b: the patch is meant to wrap whichever official SDK the user already has.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "build"]

[project.urls]
Homepage = "https://github.com/agentsphere"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsphere_e2b_patch"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

# Install a site-packages .pth so `import agentsphere_e2b_patch` runs at
# interpreter startup — zero user-code change after `pip install`.
[tool.hatch.build.targets.wheel.force-include]
"src/agentsphere_e2b_patch.pth" = "agentsphere_e2b_patch.pth"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/Makefile",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
